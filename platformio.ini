; PlatformIO Project Configuration File
; RX-8 ESP32-S3 OBD2 Dashboard

[platformio]
default_envs = native

; --- PC Simulator (SDL2) - for development without hardware ---
[env:native]
platform = native
extra_scripts = post:copy_sdl2.py
build_flags =
    -D LV_CONF_PATH="\"lv_conf.h\""
    -D DISPLAY_WIDTH=800
    -D DISPLAY_HEIGHT=480
    -I.
    -I sdl2/SDL2-2.32.8/include
    -L sdl2/SDL2-2.32.8/lib/x64
    -lSDL2
    -lSDL2main
lib_deps =
    lvgl/lvgl@^9.2

; --- ESP32-S3 target - for hardware deployment ---
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D LV_CONF_PATH="\"lv_conf.h\""
    -D DISPLAY_WIDTH=800
    -D DISPLAY_HEIGHT=480
lib_deps =
    lvgl/lvgl@^9.2
    https://github.com/PowerBroker2/ELMduino
    bodmer/TFT_eSPI@^2.5
