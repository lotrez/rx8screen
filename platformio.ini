; PlatformIO Project Configuration File
; RX-8 ESP32-S3 OBD2 Dashboard

[platformio]
default_envs = native_macos

; --- PC Simulator (SDL2) - for development without hardware ---
[env:native]
platform = native
extra_scripts = post:copy_sdl2.py
build_flags =
    -D LV_CONF_PATH="\"lv_conf.h\""
    -D DISPLAY_WIDTH=1024
    -D DISPLAY_HEIGHT=600
    -I.
    -I sdl2/SDL2-2.32.8/include
    -L sdl2/SDL2-2.32.8/lib/x64
    -lSDL2
    -lSDL2main
lib_deps =
    lvgl/lvgl@^9.2

; --- macOS native build using Homebrew SDL2 ---
[env:native_macos]
platform = native
build_flags =
    -D LV_CONF_PATH="\"lv_conf.h\""
    -D DISPLAY_WIDTH=1024
    -D DISPLAY_HEIGHT=600
    -I.
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
lib_deps =
    lvgl/lvgl@^9.2

; --- ESP32-S3 target - Waveshare ESP32-S3-Touch-LCD-7B ---
; Upgraded to Arduino-ESP32 v3.1.0 (ESP-IDF 5.3) for proper RGB LCD support:
;   - esp_lcd_rgb_panel_get_frame_buffer() for direct frame buffer access
;   - esp_lcd_rgb_panel_register_event_callbacks() for VSYNC sync
;   - RGB bounce buffer mode for tear-free PSRAM→RGB DMA pipeline
;   - PSRAM 120MHz support for 30MHz PCLK without drift
[env:esp32-s3]
platform = espressif32
board = lolin_s3_pro
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.1.0/esp32-3.1.0.zip
build_flags =
    -D LV_CONF_PATH="\"lv_conf.h\""
    -D DISPLAY_WIDTH=1024
    -D DISPLAY_HEIGHT=600
    -DBOARD_HAS_PSRAM
    -I.
    -O2
lib_deps =
    lvgl/lvgl@^9.2
    https://github.com/PowerBroker2/ELMduino
