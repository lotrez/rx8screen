; PlatformIO build for RX-8 Dashboard
; Build:  pio run -e lolin_s3_pro

[platformio]
src_dir = arduino

[env:lolin_s3_pro]
platform = espressif32
board = lolin_s3_pro
framework = arduino

monitor_speed = 115200

board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -O2

lib_deps =
    lvgl@^9.5.0
    h2zero/NimBLE-Arduino@^2.3.1
