; PlatformIO build for RX-8 Dashboard
; Use this instead of arduino-cli — arduino-cli produces BLE firmware that fails to connect.

[platformio]
src_dir = arduino

[env:lolin_s3_pro]
platform = espressif32
board = lolin_s3_pro
framework = arduino

monitor_speed = 115200

lib_deps =
    lvgl@^9.5.0
    h2zero/NimBLE-Arduino@^2.3.1
